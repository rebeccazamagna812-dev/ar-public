<dsc-progress label="Etapa 2 de 3" [value]="67" />

<div class="pagina__cabecalho">
  <h1 class="pagina__titulo">Confira seus dados</h1>
</div>

<p class="pagina__subtitulo">
  Os dados abaixo foram obtidos automaticamente do IntegraMais (RH). Confira antes de continuar.
</p>

<section class="dados" aria-label="Dados cadastrais" [attr.aria-busy]="carregando()">
  @if (dados(); as d) {
    <dsc-text-field-form label="Nome completo" state="read-only" [value]="d.nomeCompleto" />
    <dsc-text-field-form label="CPF" state="read-only" [value]="d.cpf | mascaraCpf" />
    <dsc-text-field-form label="Matrícula" state="read-only" [value]="d.matricula" />
    <dsc-text-field-form label="Documento de Identidade" state="read-only" [value]="d.documentoIdentidade" />
    <dsc-text-field-form label="E-mail corporativo" state="read-only" [value]="d.emailCorporativo" />
    <dsc-text-field-form
      label="Data de Nascimento"
      state="read-only"
      [value]="d.dataNascimento | date: 'dd/MM/yyyy' : 'UTC'"
    />
  } @else if (erroCarregamento()) {
    <!-- [PADRÃO DE MERCADO] Estado de erro de carregamento: não há tela no Figma. -->
    <dsc-card-alert class="dados__erro" variant="danger" title="Não foi possível carregar seus dados">
      Tente novamente mais tarde.
    </dsc-card-alert>
  }
</section>

<dsc-card-alert title="Importante">Se algum dado estiver incorreto, atualize-o no Portal IntegraMais.</dsc-card-alert>

<div class="pagina__acoes">
  <button dscButton type="button" appearance="outline" (click)="voltar()">Voltar</button>
  <button
    dscButton
    type="button"
    appearance="plain"
    [disabled]="!dados() || enviando()"
    [attr.aria-busy]="enviando()"
    (click)="confirmar()"
  >
    Confirmar solicitação
  </button>
</div>
