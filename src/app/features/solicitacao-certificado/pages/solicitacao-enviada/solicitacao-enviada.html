<dsc-progress [label]="etapa.rotulo" [value]="etapa.valor" />

@if (solicitacao(); as s) {
  <dsc-state-message class="enviada__mensagem" illustration="success" label="Solicitação enviada">
    Seu certificado {{ modalidade() === 'nuvem' ? 'em nuvem' : 'em mídia física' }} foi solicitado.
  </dsc-state-message>

  <div class="enviada__lista" role="list" aria-label="Detalhes da solicitação">
    <dsc-list-item label="Referência" [value]="s.referencia" />
    @if (modalidade() === 'midia-fisica') {
      <dsc-list-item
        label="Certificado e mídia"
        value="Este pedido é somente do certificado digital. Não inclui cartão ou token."
      />
    }
    <dsc-list-item
      label="Verifique seu e-mail"
      [value]="'Verifique seu e-mail ' + s.emailValidacao + ' e siga as instruções enviadas pelo SERPRO.'"
    />
    <dsc-list-item label="Não encontrou a mensagem?" value="Verifique as pastas de spam e lixo eletrônico." />
    <dsc-list-item
      label="Acompanhe a solicitação"
      value="Use “Meus pedidos” para consultar o andamento e as próximas orientações."
    />
  </div>
}

<div class="pagina__acoes">
  <button dscButton type="button" appearance="outline" (click)="recomecar()">Voltar ao início</button>
  <a dscButton appearance="plain" routerLink="/acompanhar-solicitacoes">Meus pedidos</a>
</div>
